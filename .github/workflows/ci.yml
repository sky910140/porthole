name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        vscode: ["1.137.0", "1.138.0"]
    env:
      VSCODE_TEST_VERSION: ${{ matrix.vscode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extensions/vscode/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-windows.lock
          .\.venv\Scripts\python.exe -m pip install -e . --no-deps
      - name: Install Node dependencies
        run: |
          npm ci
          npm --prefix extensions/vscode ci
          npx playwright install chromium --only-shell
      - name: Python and extension checks
        run: powershell -NoProfile -File .\scripts\self-test.ps1
      - name: Architecture boundary
        run: .\.venv\Scripts\python.exe scripts\check_architecture.py
      - name: VS Code Extension Host with local service contract
        run: npm --prefix extensions/vscode run test:integration
      - name: Local MCP to review and apply contract
        run: |
          npm run test:e2e
          node tests/e2e/changes.cjs
      - name: Build and inspect release contents
        if: matrix.python == '3.12' && matrix.vscode == '1.138.0'
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -m pip wheel . --no-deps -w dist
          npm --prefix extensions/vscode run package
          $wheel = Get-ChildItem dist\*.whl | Select-Object -First 1
          $vsix = Get-ChildItem extensions\vscode\*.vsix | Select-Object -First 1
          .\.venv\Scripts\python.exe scripts\check_release_contents.py $wheel.FullName
          .\.venv\Scripts\python.exe scripts\check_release_contents.py $vsix.FullName
