[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "porthole-workspace"
version = "0.9.1"
description = "Porthole connects MCP assistants to explicitly authorized local folders"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50",
    "defusedxml==0.7.1",
    "fastmcp==3.4.7",
    "httpx>=0.28",
    "keyring>=25",
    "openpyxl==3.1.5",
    "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "pytest-cov>=6", "ruff>=0.12"]

[project.urls]
Homepage = "https://github.com/sky910140/porthole"
Documentation = "https://github.com/sky910140/porthole/blob/main/docs/README.md"
Issues = "https://github.com/sky910140/porthole/issues"
Source = "https://github.com/sky910140/porthole"

[project.scripts]
porthole = "project_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
project_mcp = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.coverage.run]
source = ["project_mcp"]
patch = ["subprocess"]
parallel = true
