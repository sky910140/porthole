[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-zhagan"
version = "0.4.0"
description = "Connect supported AI web chats to explicitly authorized local projects"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50",
    "fastmcp==3.4.7",
    "httpx>=0.28",
    "keyring>=25",
    "uvicorn>=0.35",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "pytest-cov>=6", "ruff>=0.12"]

[project.scripts]
project-assistant = "project_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
project_mcp = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.coverage.run]
source = ["project_mcp"]
patch = ["subprocess"]
parallel = true
